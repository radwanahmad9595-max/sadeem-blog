<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>لوحة توثيق السديم — خاص</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .admin-wrap { max-width: 760px; margin: 0 auto; padding: 60px 24px 100px; position: relative; z-index: 1; }
  .admin-header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .admin-header img { width: 40px; height: 40px; }
  .admin-header h1 { font-family: var(--font-display); font-size: 1.6rem; }
  .admin-note { color: var(--text-faint); font-size: 0.85rem; margin-bottom: 40px; }
  .admin-note a { color: var(--accent-1); }
  .admin-card {
    background: var(--bg-card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 30px;
    margin-bottom: 40px;
  }
  .admin-card h2 { font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 20px; }
  .list-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px dashed rgba(255,255,255,0.08);
  }
  .list-row:last-child { border-bottom: none; }
  .list-row .meta { color: var(--text-dim); font-size: 0.9rem; }
  .list-row .meta b { color: var(--text-main); }
  .list-row .pid { font-family: 'Tajawal', monospace; color: var(--accent-2); font-size: 0.75rem; direction: ltr; display: inline-block; }
  .del-btn {
    background: rgba(160, 40, 50, 0.15);
    border: 1px solid rgba(160, 40, 50, 0.4);
    color: #e08a90;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .del-btn:hover { background: rgba(160, 40, 50, 0.28); }
  .empty-note { color: var(--text-faint); font-size: 0.9rem; text-align: center; padding: 20px 0; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="admin-wrap">
  <div class="admin-header">
    <img src="assets/logo.svg" alt="">
    <h1>لوحة توثيق السديم</h1>
  </div>
  <p class="admin-note">
    هذه صفحة خاصة لإضافة النصوص وإدارتها مباشرة — غير مرتبطة بأي قائمة ظاهرة في الموقع.
    النصوص المضافة هنا تُحفظ في نفس مخزن المتصفح الذي تستخدمه المدونة، وتظهر فوراً في
    <a href="index.html">الصفحة الرئيسية</a> عند فتحها من نفس المتصفح والجهاز.
  </p>

  <div class="admin-card">
    <h2>إضافة نص جديد</h2>
    <form class="submit-form" id="adminForm" style="padding:0; border:none; background:none;">
      <div class="field">
        <label for="authorInput">اسم الكاتب / الكاتبة</label>
        <input type="text" id="authorInput" maxlength="60" required placeholder="مثال: ليان الحوراني">
      </div>
      <div class="field">
        <label for="titleInput">عنوان النص <span class="optional">(اختياري)</span></label>
        <input type="text" id="titleInput" maxlength="80" placeholder="مثال: أنفاس الرماد">
      </div>
      <div class="field">
        <label for="bodyInput">النص الأدبي</label>
        <textarea id="bodyInput" rows="8" required placeholder="اكتب النص هنا..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block">نشر النص وتوثيقه</button>
    </form>
  </div>

  <div class="admin-card">
    <h2>النصوص الحالية</h2>
    <div id="listWrap"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="admin.js"></script>
</body>
</html>
